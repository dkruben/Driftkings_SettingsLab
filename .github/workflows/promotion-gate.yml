name: Promotion gate

# Read-only: checks one stable promotion and optionally records an environment approval.
# route direct: a stable that was never a beta; the validation record travels as the `record` input and is
#               checked against its digest and the artifact commit.
# route beta:   the optional beta-backed stable, checked against the published beta as before.
# Builds and signatures stay local (they need the game client and the offline key), and so does
# publication, because a release published with GITHUB_TOKEN would not start the Discord workflow.
run-name: "Promotion ${{ inputs.route == 'direct' && 'direct ' || '' }}${{ inputs.version }} @ ${{ inputs.stable_commit }} # ${{ inputs.artifacts_digest }}${{ inputs.route == 'direct' && ' ' || '' }}${{ inputs.record_digest }}"

on:
  workflow_dispatch:
    inputs:
      route:
        description: Publication route
        required: true
        default: direct
        type: choice
        options:
          - direct
          - beta
      version:
        description: Stable version for route direct (for example 1.2.3); published beta for route beta (for example 1.2.3-beta.4)
        required: true
        type: string
      stable_commit:
        description: Full SHA-1 of the artifact commit on main
        required: true
        type: string
      artifacts_digest:
        description: Artifacts digest printed by promote_release.py build; complete SHA-256 for route direct, 16 hex digits for route beta
        required: true
        type: string
      record_digest:
        description: Route direct only; complete SHA-256 of the validation record (empty for route beta)
        required: false
        default: ''
        type: string
      record:
        description: Route direct only; the validation record text (empty for route beta)
        required: false
        default: ''
        type: string
      request_approval:
        description: After the checks pass, wait for approval in the stable-release environment
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: promotion-gate
  cancel-in-progress: false

jobs:
  validate:
    name: Validate promotion
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check the promotion
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE: ${{ inputs.route }}
          VERSION: ${{ inputs.version }}
          STABLE_COMMIT: ${{ inputs.stable_commit }}
          ARTIFACTS_DIGEST: ${{ inputs.artifacts_digest }}
          RECORD_DIGEST: ${{ inputs.record_digest }}
          RECORD: ${{ inputs.record }}
        run: |
          set -euo pipefail
          if [ "$ROUTE" = "direct" ]; then
            test -n "$RECORD" || { echo "route direct needs the validation record"; exit 1; }
            printf '%s' "$RECORD" > "$RUNNER_TEMP/validation-record.md"
            python -B build_tools/promote_release.py check --stable "$VERSION" \
              --record "$RUNNER_TEMP/validation-record.md" --record-digest "$RECORD_DIGEST" \
              --commit "$STABLE_COMMIT" --digest "$ARTIFACTS_DIGEST"
          else
            python -B build_tools/promote_release.py check --beta "$VERSION" \
              --commit "$STABLE_COMMIT" --digest "$ARTIFACTS_DIGEST"
          fi

  approve:
    name: Environment approval
    needs: validate
    if: inputs.request_approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment: stable-release
    steps:
      - name: Record the approval
        run: echo "Approved in the stable-release environment; publication stays local."
