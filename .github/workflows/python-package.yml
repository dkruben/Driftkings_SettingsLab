name: Validate mod sources and configurations

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test pure settings logic with Python 3
        run: python -m unittest discover -s tests/settings_panel -p 'test_*.py'
      - name: Test portable Core logic with Python 3
        run: python -m unittest discover -s tests/core -p 'test_*.py'
      - name: Validate build inputs and package plan
        run: python build_tools/validate_build_data.py
      - name: Validate locale catalogs
        run: python build_tools/validate_locales.py
      - name: Check client sources for undefined names
        run: |
          python -m pip install pyflakes
          python build_tools/check_undefined_names.py
      - name: Test installer generation and packaged media
        run: python -m unittest discover -s tests/installer -p 'test_*.py'
      - name: Generate installer component contract
        run: python build_tools/build_installer.py
      - name: Check generated defaults are in sync
        run: python build_tools/generate_defaults.py --check
      - name: Validate JSON resources and manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for root in ('mod/res', 'res', 'build_data'):
              for path in Path(root).rglob('*.json'):
                  json.loads(path.read_text(encoding='utf-8-sig'))
          PY
      - name: Parse client sources with Python 2.7
        run: >-
          docker run --rm -v "$PWD:/work:ro" -w /work python:2.7
          python -c "import ast, os; files = [os.path.join(root, name) for root, dirs, names in os.walk('mod/res/scripts/client') for name in names if name.endswith('.py')]; [ast.parse(open(path, 'rb').read(), path) for path in files]; print('%d Python sources parsed' % len(files))"
      - name: Check Gameface JavaScript
        run: find mod/res/gui/gameface -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install JavaScript check dependencies
        run: npm ci --ignore-scripts
      - name: Lint Gameface JavaScript as ES5
        run: npm run lint
      - name: Test pure settings logic with Python 2.7
        run: >-
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/work:ro" -w /work python:2.7
          python -m unittest discover -s tests/settings_panel -p 'test_*.py'
      - name: Test Gameface state and layout handling
        run: npm test
      - name: Test portable Core logic with Python 2.7
        run: >-
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/work:ro" -w /work python:2.7
          python -m unittest discover -s tests/core -p 'test_*.py'
