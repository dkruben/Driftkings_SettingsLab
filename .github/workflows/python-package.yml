name: Validate mod sources and configurations

# One validation job for every commit that reaches a permanent branch, and for every pull request into one.
# Release packaging is not run here: the compiler and the publication tools do that explicitly.
on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install the YAML parser used by the workflow contract tests
        run: python -m pip install pyyaml
      - name: Test portable runtime logic and integrations with Python 3
        run: python -B tests/run_python.py --suite runtime
      - name: Test build tooling, installer contract and packaged media with Python 3
        run: python -B tests/run_python.py --suite build
      - name: Validate build inputs and package plan
        run: python build_tools/validate_build_data.py
      - name: Validate locale catalogs
        run: python build_tools/validate_locales.py
      - name: Check client sources for undefined names
        run: |
          python -m pip install pyflakes
          python build_tools/check_undefined_names.py
      - name: Check client import order
        run: |
          python -m pip install 'isort==9.0.2'
          python -m isort --settings-path mod/res/scripts/client --check-only mod/res/scripts/client
      - name: Check generated defaults are in sync
        run: python build_tools/generate_defaults.py --check
      - name: Validate JSON resources and manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for root in ('mod/res', 'res', 'build_data'):
              for path in Path(root).rglob('*.json'):
                  json.loads(path.read_text(encoding='utf-8-sig'))
          PY
      - name: Parse client sources with Python 2.7
        run: >-
          docker run --rm -v "$PWD:/work:ro" -w /work python:2.7
          python -c "import ast, os; files = [os.path.join(root, name) for root, dirs, names in os.walk('mod/res/scripts/client') for name in names if name.endswith('.py')]; [ast.parse(open(path, 'rb').read(), path) for path in files]; print('%d Python sources parsed' % len(files))"
      - name: Install JavaScript check dependencies
        run: npm --prefix build_tools/javascript ci --ignore-scripts
      - name: Lint Gameface JavaScript as ES5
        run: npm --prefix build_tools/javascript run lint
      - name: Test Gameface state and layout handling
        run: npm --prefix build_tools/javascript test
      - name: Test portable runtime logic and integrations with Python 2.7
        run: >-
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/work:ro" -w /work python:2.7
          python -B tests/run_python.py --suite runtime
